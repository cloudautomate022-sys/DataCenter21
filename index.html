<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Data Center desde 0 - Plataforma educativa interactiva de infraestructura de centros de datos.">
  <title>Data Center desde 0</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#home" id="brandLink" aria-label="Data Center desde 0">
      <span class="brand-mark" aria-hidden="true">
        <span>DC</span>
        <span class="brand-dot"></span>
      </span>
      <span class="brand-copy">
        <strong id="brandName">Data Center desde 0</strong>
        <span id="brandTag">Infraestructura crítica, explicada desde cero</span>
      </span>
    </a>

    <div class="top-actions">
      <button type="button" class="ai-status is-offline" id="aiStatus" aria-live="polite" aria-label="AI status">
        <span class="ai-dot" aria-hidden="true"></span>
        <span class="ai-label" id="aiStatusLabel">IA offline</span>
      </button>
      <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" data-lang="it" aria-pressed="false">IT</button>
      </div>
      <button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle theme">
        <span class="theme-icon" id="themeIcon" aria-hidden="true">◐</span>
        <span class="theme-label" id="themeLabel">Dark</span>
      </button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-kicker" id="sidebarKicker">Ruta de aprendizaje</span>
        <h2 id="sidebarTitle">10 módulos técnicos</h2>
      </div>
      <nav class="tabs" id="tabs" aria-label="Modules"></nav>
      <div class="sidebar-foot">
        <div class="progress-block">
          <div class="progress-top">
            <span id="progressLabel">Progreso</span>
            <strong id="progressValue">0%</strong>
          </div>
          <div class="progress-track"><span id="progressBar"></span></div>
          <p id="progressHint">Completa los módulos para avanzar.</p>
        </div>
      </div>
    </aside>

    <main id="app" class="main" tabindex="-1">
      <noscript>
        <div class="card">
          <h2>JavaScript es necesario</h2>
          <p>Esta plataforma es una Single Page Application y requiere JavaScript habilitado.</p>
        </div>
      </noscript>
    </main>
  </div>

  <footer class="footer">
    <span id="footerLeft">Data Center desde 0 · Plataforma educativa</span>
    <span id="footerRight">HTML5 · CSS3 · JavaScript nativo</span>
  </footer>

  <div class="toast-stack" id="toasts" aria-live="polite" aria-atomic="true"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/content.en.js"></script>
  <script src="assets/js/content.es.js"></script>
  <script src="assets/js/content.it.js"></script>
  <script src="assets/js/activities.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
